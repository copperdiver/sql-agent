# Host ports are overridable because a developer machine often already has a Postgres or SQL Server on the
# default port; a collision makes `docker compose up` fail outright rather than degrade. Container-side ports
# stay fixed. Override with SQLAGENT_TEST_POSTGRES_PORT / SQLAGENT_TEST_SQLSERVER_PORT, and use the same
# values in the SQLAGENT_TEST_POSTGRES / SQLAGENT_TEST_SQLSERVER connection strings (see docs/runbook.md).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sqlagent
      POSTGRES_USER: sqlagent
      POSTGRES_PASSWORD: sqlagent_pw
    ports:
      - "${SQLAGENT_TEST_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlagent -d sqlagent"]
      interval: 5s
      timeout: 5s
      retries: 20

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SqlAgent_pw1"
      MSSQL_PID: "Developer"
    ports:
      - "${SQLAGENT_TEST_SQLSERVER_PORT:-1433}:1433"
